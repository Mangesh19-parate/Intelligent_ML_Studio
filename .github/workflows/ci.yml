name: ML Studio CI/CD Test-Gated Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Lint, Test Suite & Vulnerability Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Dependency Security Audit (CVEs)
        run: |
          pip-audit --desc

      - name: Run Pytest Test Suite (Leakage Invariants & Endpoints)
        env:
          ENV: testing
          AUTO_CREATE_TABLES: true
          JWT_SECRET: testing-jwt-secret-key-must-be-at-least-32-chars
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          pytest backend/tests -v --durations=10

  frontend-quality-gate:
    name: Frontend Typecheck, Lint & Production Bundle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript Types & Build Production Bundle
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build

  production-promotion-gate:
    name: Production Promotion Gate
    needs: [backend-quality-gate, frontend-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Promotion Readiness
        run: |
          echo "All quality, security, and invariant gates passed cleanly."
          echo "Build artifacts verified and ready for production promotion."
