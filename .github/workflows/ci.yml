name: Intelligent ML Studio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-research-verification:
    name: Backend Tests, Invariants & Research Acceptance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install pytest pytest-cov ruff

    - name: Lint with Ruff
      run: |
        ruff check backend/app

    - name: Run Alembic Database Migrations Test
      env:
        DATABASE_URL: sqlite:///./ci_test.db
        AUTO_CREATE_TABLES: false
      run: |
        cd backend
        alembic upgrade head

    - name: Run System Integrity & Invariant Suite
      env:
        DATABASE_URL: sqlite:///./ci_test.db
        JWT_SECRET: ci-test-secret-key-32-chars-length!!
      run: |
        pytest backend/tests/test_system_integrity.py
        pytest backend/tests/test_lineage_and_reproducibility.py
        pytest backend/tests/test_durable_tasks.py
        pytest backend/tests/test_chaos_and_resilience.py
        pytest backend/tests/test_feature_selection_isolation.py
        pytest backend/tests/test_p1_hardening.py
        pytest backend/tests/test_alembic_migrations.py
        pytest backend/tests/test_deployments_and_gates.py
        pytest backend/tests/test_golden_path_e2e.py
        pytest backend/tests/test_customer_churn_e2e.py

    - name: Run Complete Backend Pytest Suite
      env:
        DATABASE_URL: sqlite:///./ci_test.db
        JWT_SECRET: ci-test-secret-key-32-chars-length!!
      run: |
        pytest backend/tests/

    - name: Run Clean Package Export Verification
      run: |
        python scripts/export_clean_repo.py --output-dir ./dist_ci

    - name: Run Research Track Acceptance Checks
      run: |
        python research/acceptance_check.py
        python research/statistical_analysis.py

    - name: Run QA Acceptance Suite
      env:
        DATABASE_URL: sqlite:///./ci_test.db
        JWT_SECRET: ci-test-secret-key-32-chars-length!!
      run: |
        python qa/run_acceptance_suite.py

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: TypeScript type checking
      run: |
        cd frontend
        npm run typecheck

    - name: Build frontend production bundle
      run: |
        cd frontend
        npm run build
