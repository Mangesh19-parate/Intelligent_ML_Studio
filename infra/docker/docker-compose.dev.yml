version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ml_studio_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_studio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ml_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: ml_studio_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: development
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ml_studio}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-1234567890}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      STORAGE_LOCAL_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - datasets_dev_data:/data

  worker:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: ml_studio_worker_dev
    restart: unless-stopped
    command: python -m app.tasks.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ml_studio}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-1234567890}
      STORAGE_LOCAL_DIR: /data
    volumes:
      - datasets_dev_data:/data

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: ml_studio_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_dev_data:
    name: ml_studio_postgres_dev_data
  datasets_dev_data:
    name: ml_studio_datasets_dev_data
