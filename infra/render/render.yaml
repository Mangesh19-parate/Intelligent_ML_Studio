services:
  # ML Studio FastAPI Web Backend Service
  - type: web
    name: ml-studio-api
    runtime: python
    rootDir: apps/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health/ready
    autoDeploy: true

    envVars:
      - key: ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION_NAME
        value: "us-east-1"
      - key: DATABASE_URL
        fromDatabase:
          name: ml-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ARTIFACT_SIGNING_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
        # Example: https://your-frontend.vercel.app,http://localhost:3000

  # ML Studio Durable Task Background Worker Service (Shares DB & Object Store)
  - type: worker
    name: ml-studio-worker
    runtime: python
    rootDir: apps/backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.tasks.worker
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_BUCKET_NAME
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: S3_BUCKET_NAME
      - key: S3_ENDPOINT_URL
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: S3_ENDPOINT_URL
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_REGION_NAME
        value: "us-east-1"
      - key: DATABASE_URL
        fromDatabase:
          name: ml-studio-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: JWT_SECRET
      - key: ARTIFACT_SIGNING_KEY
        fromService:
          type: web
          name: ml-studio-api
          envVarKey: ARTIFACT_SIGNING_KEY

databases:
  # Managed PostgreSQL Instance
  - name: ml-studio-db
    databaseName: mlstudio
    user: mlstudio_user
    plan: starter
